<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rosnaldo · Rugido</title><style>*{box-sizing:border-box}body{margin:0;background:#24291f;color:#e7dcc5;font:16px system-ui}main{max-width:900px;margin:auto;padding:28px}h1{font:32px Georgia;margin:0 0 10px}p{color:#b8b79e;line-height:1.5}.controls{position:sticky;top:0;display:flex;gap:15px;align-items:center;flex-wrap:wrap;padding:16px;background:#24291ff5;z-index:1}button,select{padding:9px 14px;border:1px solid #777b61;border-radius:6px;background:#424b37;color:#f1e5c9;font:inherit}input{accent-color:#a7767c;flex:1;min-width:120px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#33382e;border:1px solid #50573f;border-radius:16px;overflow:hidden}figcaption{padding:14px 18px;display:flex;justify-content:space-between;gap:10px}img{display:block;width:100%;aspect-ratio:1;object-fit:contain;padding:12px}a{color:#dcc4a6;font-size:14px}footer{margin-top:20px;color:#a7ad95;font-size:14px}@media(max-width:500px){main{padding:14px}.grid{grid-template-columns:1fr}.controls{padding:12px 0}}</style><main><h1>Rosnaldo · Rugido</h1><p>Arte quadro a quadro nas quatro direções. Sangue, feridas e podridão, sem ossos expostos.</p><div class="controls"><button id="play">Pausar</button><input id="frame" aria-label="Quadro" type="range" min="0" max="11" value="0"><span id="counter">1 / 12</span><label>Velocidade <select id="speed"><option value="300">0,5×</option><option value="150" selected>1×</option><option value="100">1,5×</option></select></label></div><div class="grid"><figure><figcaption><b>Direita</b><a href="direita.png">Abrir PNG</a></figcaption><img data-direction="direita" src="quadros/direita-01.png" alt="Rosnaldo: Direita"></figure><figure><figcaption><b>Esquerda</b><a href="esquerda.png">Abrir PNG</a></figcaption><img data-direction="esquerda" src="quadros/esquerda-01.png" alt="Rosnaldo: Esquerda"></figure><figure><figcaption><b>Frente · baixo</b><a href="frente.png">Abrir PNG</a></figcaption><img data-direction="frente" src="quadros/frente-01.png" alt="Rosnaldo: Frente · baixo"></figure><figure><figcaption><b>Costas · cima</b><a href="costas.png">Abrir PNG</a></figcaption><img data-direction="costas" src="quadros/costas-01.png" alt="Rosnaldo: Costas · cima"></figure></div><footer>12 quadros por direção · 150 ms por quadro · fundo transparente. Estas pranchas serão a referência para a etapa vetorial.</footer></main><script>let frame=0,playing=true,last=performance.now();const slider=document.getElementById('frame'),play=document.getElementById('play'),counter=document.getElementById('counter'),speed=document.getElementById('speed');for(const direction of ["direita","esquerda","frente","costas"])for(let n=1;n<=12;n++){const im=new Image();im.src='quadros/'+direction+'-'+String(n).padStart(2,'0')+'.png';}function draw(){slider.value=frame;counter.textContent=(frame+1)+' / 12';document.querySelectorAll('img[data-direction]').forEach(im=>im.src='quadros/'+im.dataset.direction+'-'+String(frame+1).padStart(2,'0')+'.png');}play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Reproduzir';last=performance.now();};slider.oninput=()=>{frame=Number(slider.value);playing=false;play.textContent='Reproduzir';draw();};function tick(now){if(playing&&now-last>=Number(speed.value)){frame=(frame+1)%12;last=now;draw();}requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>
