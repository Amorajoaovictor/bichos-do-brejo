<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosnaldo · Animações</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#24291f;color:#e7dcc5;font:16px system-ui}main{max-width:940px;margin:auto;padding:24px}h1{font:34px Georgia;margin:0}p{color:#bdbaa5;line-height:1.5}a{color:#e5c096}.controls{position:sticky;top:0;z-index:1;background:#24291ff5;padding:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;background:#424b37;color:inherit;border:1px solid #777b61;border-radius:6px;padding:9px}input{accent-color:#ba7b87;max-width:160px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#33382e;border-radius:14px;padding:12px}figcaption{color:#c7c2aa}canvas{display:block;width:100%;aspect-ratio:1}#status{min-height:24px}@media(max-width:540px){main{padding:14px}.grid{grid-template-columns:1fr}}
</style>
<main><h1>Rosnaldo</h1><p>Repouso, ataques, reações e queda nas quatro direções. Pause para comparar as poses ou escolha um quadro.</p>
<div class="controls"><label>Ação <select id="action"><option value="idle">Repouso</option><option value="bite">Mordida</option><option value="roar">Rugido</option><option value="hit">Receber golpe</option><option value="bleed">Sangramento</option><option value="death">Derrota</option></select></label><button id="play">Pausar</button><label>Velocidade <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></label><label>Quadro <input id="frame" type="range" min="0" max="11" value="0"></label><span id="counter">1 / 12</span></div>
<p id="status" role="status">Carregando…</p><div class="grid"></div><p>A derrota permanece no último quadro. Use Reproduzir para revê-la. <a href="/">Abrir o jogo</a></p></main>
<script type="module">
import {bossPngLayout} from '/boss-png-layout.js';
const $=id=>document.getElementById(id),views=['right','left','down','up'],names=['Direita','Esquerda','Frente · baixo','Costas · cima'];
const durations={idle:1920,bite:1200,roar:1800,hit:520,bleed:700,death:1150},canvases=[],cache=new Map();
let kind='idle',frame=0,playing=true,ready=false,last=performance.now(),elapsed=0,request=0;
for(const [i,view] of views.entries()){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=names[i];canvas.width=400;canvas.height=400;canvas.setAttribute('aria-label','Rosnaldo: '+names[i]);figure.append(caption,canvas);document.querySelector('.grid').append(figure);canvases.push(canvas);}
function draw(){if(!ready)return;const images=cache.get(kind);views.forEach((view,i)=>{const ctx=canvases[i].getContext('2d'),l=bossPngLayout[kind][view],[dx,dy]=l.offsets[frame];ctx.clearRect(0,0,400,400);ctx.drawImage(images[i][frame],50+l.tx+dx,25+l.ty+dy,l.size*l.k,l.size*l.k);});$('frame').value=frame;$('counter').textContent=(frame+1)+' / 12';$('play').textContent=playing?'Pausar':'Reproduzir';}
async function load(){const token=++request;kind=$('action').value;frame=0;elapsed=0;ready=false;$('status').textContent='Carregando…';const selected=kind;try{if(!cache.has(selected)){const images=await Promise.all(views.map(view=>Promise.all(Array.from({length:12},(_,n)=>new Promise((resolve,reject)=>{const l=bossPngLayout[selected][view],img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Não foi possível abrir a animação.'));img.src=`${l.folder}/quadros/${l.prefix}-${String(n+1).padStart(2,'0')}.png`;})))));cache.set(selected,images);}if(token!==request)return;ready=true;playing=true;last=performance.now();$('status').textContent='12 quadros · quatro direções';draw();}catch(error){if(token===request)$('status').textContent=error.message;}}
$('action').onchange=load;$('play').onclick=()=>{if(frame===11&&kind==='death'&&!playing){frame=0;elapsed=0;}playing=!playing;last=performance.now();draw();};$('frame').oninput=()=>{playing=false;frame=Number($('frame').value);elapsed=frame*durations[kind]/12;draw();};$('speed').onchange=()=>{last=performance.now();};
function tick(now){const dt=Math.min(100,now-last);last=now;if(ready&&playing){elapsed+=dt*Number($('speed').value);if(kind==='death'&&elapsed>=durations[kind]){frame=11;playing=false;}else{elapsed%=durations[kind];frame=Math.min(11,Math.floor(elapsed/durations[kind]*12));}draw();}requestAnimationFrame(tick);}await load();requestAnimationFrame(tick);
</script></html>
