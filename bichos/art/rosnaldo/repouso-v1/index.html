<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rosnaldo · Repouso</title><style>*{box-sizing:border-box}body{margin:0;background:#24291f;color:#e7dcc5;font:16px system-ui}main{max-width:900px;margin:auto;padding:28px}h1{font:32px Georgia;margin:0 0 10px}p{color:#b8b79e;line-height:1.5}.controls{position:sticky;top:0;display:flex;gap:15px;align-items:center;flex-wrap:wrap;padding:16px;background:#24291ff5;z-index:1}button,select{padding:9px 14px;border:1px solid #777b61;border-radius:6px;background:#424b37;color:#f1e5c9;font:inherit}input{accent-color:#a7767c;flex:1;min-width:120px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#33382e;border-radius:14px;padding:12px;overflow:hidden}figcaption{font-size:14px;color:#b8b79e;margin-bottom:8px}.grid img{width:100%;display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>Rosnaldo · Repouso</h1><p>Doze quadros por direção. A prancha de origem fica ao lado dos arquivos derivados: <code>quadros/</code>, GIFs e este visualizador.</p><div class="controls"><button id="play">Pausar</button><label>Quadro <input id="frame" type="range" min="0" max="11" value="0"></label><span id="counter">1 / 12</span><select id="speed"><option value="150">150 ms</option><option value="90">90 ms</option><option value="240">240 ms</option></select></div><div class="grid"><figure><figcaption>Direita</figcaption><img data-direction="direita" alt="direita" src="quadros/direita-01.png"></figure><figure><figcaption>Esquerda</figcaption><img data-direction="esquerda" alt="esquerda" src="quadros/esquerda-01.png"></figure><figure><figcaption>Frente · baixo</figcaption><img data-direction="frente" alt="frente" src="quadros/frente-01.png"></figure><figure><figcaption>Costas · cima</figcaption><img data-direction="costas" alt="costas" src="quadros/costas-01.png"></figure></div></main><script>const frames=[...document.querySelectorAll('img[data-direction]')],range=document.getElementById('frame'),counter=document.getElementById('counter'),speed=document.getElementById('speed'),play=document.getElementById('play');let index=0,timer=null;const show=i=>{index=i;for(const img of frames)img.src='quadros/'+img.dataset.direction+'-'+String(i+1).padStart(2,'0')+'.png';range.value=i;counter.textContent=(i+1)+' / 12';};const stop=()=>{clearInterval(timer);timer=null;play.textContent='Reproduzir';};const start=()=>{stop();timer=setInterval(()=>show((index+1)%12),Number(speed.value));play.textContent='Pausar';};play.onclick=()=>timer?stop():start();range.oninput=()=>{stop();show(Number(range.value));};speed.onchange=()=>{if(timer)start();};show(0);</script>
