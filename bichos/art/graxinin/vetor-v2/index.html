<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Graxinin · vetor articulado</title><style>body{background:#24291f;color:#eee3c9;font:16px system-ui;margin:24px}main{max-width:900px;margin:auto}button,select{font:inherit;background:#454d39;color:inherit;border:1px solid #7f846e;border-radius:6px;padding:9px}nav{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;background:#33382e;border-radius:12px;padding:8px}img{width:100%;display:block}input{accent-color:#b7695e}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style><main><h1>Graxinin · vetor articulado</h1><p>Quatro direções. Escolha uma ação e pause para observar cada pose.</p><nav><select id="action"><option>repouso</option><option>caminhada</option><option>arremesso</option><option>garrafada</option><option>dano</option><option>derrota</option></select><button id="play">Pausar</button><input id="frame" aria-label="Quadro" type="range" min="0" max="29" value="0"><span id="counter">1 / 30</span><select id="speed"><option value="1">1×</option><option value=".5">0,5×</option><option value="1.5">1,5×</option></select></nav><div class="grid"><figure><figcaption>Frente</figcaption><img data-direction="down" src="quadros/repouso-down-01.svg"></figure><figure><figcaption>Direita</figcaption><img data-direction="right" src="quadros/repouso-right-01.svg"></figure><figure><figcaption>Esquerda</figcaption><img data-direction="left" src="quadros/repouso-left-01.svg"></figure><figure><figcaption>Costas</figcaption><img data-direction="up" src="quadros/repouso-up-01.svg"></figure></div></main><script>const durations={"repouso":2400,"caminhada":620,"arremesso":1200,"garrafada":1200,"dano":520,"derrota":1150},action=document.querySelector('#action'),play=document.querySelector('#play'),range=document.querySelector('#frame'),counter=document.querySelector('#counter'),speed=document.querySelector('#speed');let i=0,running=true,last=0;const show=()=>{document.querySelectorAll('img').forEach(img=>img.src='quadros/'+action.value+'-'+img.dataset.direction+'-'+String(i+1).padStart(2,'0')+'.svg');range.value=i;counter.textContent=(i+1)+' / 30'};play.onclick=()=>{running=!running;play.textContent=running?'Pausar':'Reproduzir'};range.oninput=()=>{running=false;play.textContent='Reproduzir';i=+range.value;show()};action.onchange=()=>{i=0;show()};function tick(t){const delay=i===29&&action.value==='derrota'?1200:durations[action.value]/30;if(running&&t-last>delay/+speed.value){i=(i+1)%30;show();last=t}requestAnimationFrame(tick)}show();requestAnimationFrame(tick);</script>
