<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Farrapo · sufoco na rajada</title>
<style>body{max-width:960px;margin:28px auto;padding:0 20px;background:#24291f;color:#e4dcc9;font:16px system-ui}h1{font:32px Georgia}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;padding:12px 0;background:#24291f}button,select{padding:10px;background:#414a35;color:inherit;border:1px solid #7c8568;border-radius:6px}input{flex:1;min-width:140px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:12px 0;background:#363b31;border-radius:12px;padding:14px}figure img{width:100%;max-height:450px;object-fit:contain}.compare{display:block;max-width:100%;margin:24px auto}a{color:#b4d394}@media(max-width:550px){main{grid-template-columns:1fr}}</style>
<h1>Farrapo · sufoco na rajada</h1><p>O rosto avermelha aos poucos com o esforço e recupera a cor gradualmente no final. Os olhos ficam espremidos durante a rajada, com a cabeça levemente baixa e a boca frontal original.</p>
<img class="compare" src="rosto-animado.gif" alt="Expressão animada do Farrapo em perfil e de frente">
<header><button id="play">Pausar</button><select id="speed" aria-label="Velocidade"><option value=".5">0,5×</option><option selected value="1">1×</option><option value="1.5">1,5×</option></select><input id="frame" type="range" min="0" max="69" value="0" aria-label="Quadro"><output id="count">1 / 70</output><output id="emotion">Desespero</output></header>
<main><figure><figcaption>Direita</figcaption><img id="right" src="quadros/rajada-right-01.png" alt="Farrapo na rajada, direita"></figure><figure><figcaption>Esquerda</figcaption><img id="left" src="quadros/rajada-left-01.png" alt="Farrapo na rajada, esquerda"></figure><figure><figcaption>Frente</figcaption><img id="down" src="quadros/rajada-down-01.png" alt="Farrapo na rajada, frente"></figure><figure><figcaption>Costas</figcaption><img id="up" src="quadros/rajada-up-01.png" alt="Farrapo na rajada, costas"></figure></main>

<script>const emotions=["panic","panic","panic","panic","panic","panic","panic","panic","panic","panic","panic","panic","panic","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","strain","relief"];const times=[33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,33,1100];const play=document.getElementById('play'),speed=document.getElementById('speed'),slider=document.getElementById('frame');let playing=true,index=0,last=0;const images=Array.from({length:70},(_,i)=>Object.keys({"right":"Direita","left":"Esquerda","down":"Frente","up":"Costas"}).map(d=>{const img=new Image();img.src='quadros/rajada-'+d+'-'+String(i+1).padStart(2,'0')+'.png';return img}));function show(){for(const d of ['right','left','down','up'])document.getElementById(d).src='quadros/rajada-'+d+'-'+String(index+1).padStart(2,'0')+'.png';slider.value=index;document.getElementById('count').value=(index+1)+' / 70';document.getElementById('emotion').value={panic:'Desespero',strain:'Aperto!',relief:'Alívio'}[emotions[index]]}play.onclick=()=>{playing=!playing;last=performance.now();play.textContent=playing?'Pausar':'Reproduzir'};slider.oninput=()=>{playing=false;play.textContent='Reproduzir';index=+slider.value;show()};speed.onchange=()=>{last=performance.now()};function tick(t){if(playing&&t-last>=times[index]/+speed.value){index=(index+1)%70;show();last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></html>
