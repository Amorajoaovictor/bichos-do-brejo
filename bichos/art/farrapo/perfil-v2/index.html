<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Farrapo · perfis refeitos</title><style>body{margin:24px auto;max-width:980px;background:#24291f;color:#e4dcc9;font:16px system-ui;padding:0 20px}h1{font:32px Georgia}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:10px;background:#414a35;color:inherit;border:1px solid #7c8568;border-radius:6px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:18px 0;background:#363b31;border-radius:12px;padding:14px}figure img{width:100%;max-height:480px;object-fit:contain}input{flex:1} .compare{width:100%}@media(max-width:550px){main{grid-template-columns:1fr}}</style><h1>Farrapo · perfis refeitos</h1><p>Orelhas assimétricas, pelagem gasta e expressão nervosa.</p><header><button id="play">Pausar</button><select id="action"><option value="repouso">repouso</option><option value="salto">salto</option><option value="coice">coice</option><option value="rajada">rajada</option></select><select id="speed"><option value=".5">0,5×</option><option selected value="1">1×</option><option value="1.5">1,5×</option></select><input id="frame" type="range" min="0" max="11" value="0" aria-label="Quadro"><output id="count">1 / 12</output></header><main><figure><figcaption>Direita</figcaption><img id="right" alt="Farrapo de perfil, direita" src="quadros/repouso-right-01.png"></figure><figure><figcaption>Esquerda</figcaption><img id="left" alt="Farrapo de perfil, esquerda" src="quadros/repouso-left-01.png"></figure></main><p>Coice: contato próximo do quadro 6. A rajada mostra o desespero do Farrapo.</p><img class="compare" src="comparacao.png" alt="Desenho original, perfil anterior e novos perfis"><script>const durations={"repouso":2400,"salto":480,"coice":1050,"rajada":2300};let playing=true,index=0,last=0;const play=document.getElementById('play'),action=document.getElementById('action'),speed=document.getElementById('speed'),slider=document.getElementById('frame');function show(){for(const d of ['right','left'])document.getElementById(d).src='quadros/'+action.value+'-'+d+'-'+String(index+1).padStart(2,'0')+'.png';slider.value=index;document.getElementById('count').value=(index+1)+' / 12'}play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Reproduzir'};slider.oninput=()=>{playing=false;play.textContent='Reproduzir';index=+slider.value;show()};action.onchange=()=>{index=0;show()};function tick(t){if(playing&&t-last>durations[action.value]/12/+speed.value){index=(index+1)%12;show();last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></html>
